apiVersion: v1
kind: Secret
metadata:
  name: gitlab-oidc-secret
  namespace: gitlab
type: Opaque
stringData:
  provider: |
    {
      "name": "openid_connect",
      "label": "Keycloak",
      "args": {
        "name": "openid_connect",
        "scope": ["openid", "profile", "email"],
        "response_type": "code",
        "issuer": "https://keycloak.homelab.local/realms/homelab",
        "discovery": true,
        "client_auth_method": "query",
        "uid_field": "preferred_username",
        "pkce": true,
        "client_options": {
          "identifier": "gitlab",
          "secret": "CHANGE_ME_GITLAB_OIDC",
          "redirect_uri": "https://gitlab.homelab.local/users/auth/openid_connect/callback"
        }
      }
    }
