controller:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - argo-workflows.homelab.local
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: argo-workflows-tls
        hosts:
          - argo-workflows.homelab.local

artifactRepository:
  s3:
    bucket: argo-workflows
    endpoint: minio.minio.svc.cluster.local:9000
    insecure: true
    accessKeySecret:
      name: argo-workflows-minio
      key: accesskey
    secretKeySecret:
      name: argo-workflows-minio
      key: secretkey
