grafana:
  sidecar:
    datasources:
      enabled: true
      isDefaultDatasource: false

loki:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
  config:
    auth_enabled: false
    chunk_store_config:
      max_look_back_period: 168h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

promtail:
  enabled: false
