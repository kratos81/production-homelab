        gnetId: 22867
        revision: 1
        datasource: Prometheus
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    templates:
      - '/etc/alertmanager/config/*.tmpl'
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: mattermost
      routes:
        - receiver: mattermost
          matchers:
            - severity =~ "critical|warning"
          continue: true
    receivers:
      - name: mattermost
        webhook_configs:
          - url: "http://am-mm-forwarder.monitoring.svc.cluster.local:9876/webhook"
            send_resolved: true
  templateFiles:
    mattermost.tmpl: |-
      {{ define "mattermost.text" }}
      {{ range .Alerts }}
      {{ if eq .Status "firing" }}:fire: **[{{ .Labels.severity | toUpper }}]**{{ else }}:white_check_mark: **[RESOLVED]**{{ end }} {{ .Labels.alertname }}
      **Namespace:** {{ .Labels.namespace }}
      {{ if .Labels.pod }}**Pod:** {{ .Labels.pod }}{{ end }}
      {{ if .Labels.deployment }}**Deployment:** {{ .Labels.deployment }}{{ end }}
      **Summary:** {{ .Annotations.summary }}
      {{ if .Annotations.description }}**Details:** {{ .Annotations.description }}{{ end }}
      ---
      {{ end }}
      {{ end }}
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
