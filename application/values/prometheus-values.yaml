prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  service:
    type: ClusterIP
  adminPassword: "CHANGE_ME_GRAFANA_ADMIN"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - grafana.homelab.local
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.homelab.local
  assertNoLeakedSecrets: false
  grafana.ini:
    server:
      root_url: https://grafana.homelab.local
    analytics:
      reporting_enabled: false
    security:
      login_remember_days: 7
    auth:
      login_cookie_name: grafana_homelab
    branding:
      login_logo: "https://homelab.local/en/wp-content/uploads/2024/08/emage_logo_site-Phone-300x155.png"
      login_background: ""
      app_title: "HomeLab - Grafana"
      login_subtitle: "Future-Proof Your Skills and Level Up Your Career"
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: grafana-keycloak-secret-2024
      scopes: openid profile email
      auth_url: https://keycloak.homelab.local/realms/homelab/protocol/openid-connect/auth
      token_url: https://keycloak.homelab.local/realms/homelab/protocol/openid-connect/token
      api_url: https://keycloak.homelab.local/realms/homelab/protocol/openid-connect/userinfo
      tls_skip_verify_insecure: true
      role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      ingress-nginx:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus
      harbor:
        gnetId: 14060
        revision: 1
        datasource: Prometheus
      minio:
        gnetId: 13502
        revision: 1
        datasource: Prometheus
      vault:
        gnetId: 12904
        revision: 1
        datasource: Prometheus
      keycloak:
        gnetId: 19659
        revision: 1
        datasource: Prometheus
      jupyterhub:
        gnetId: 17654
        revision: 1
        datasource: Prometheus
      loki:
        gnetId: 13639
        revision: 1
        datasource: Prometheus
      litmus-chaos:
        gnetId: 12096
        revision: 1
        datasource: Prometheus
      argo-workflows:
        gnetId: 20348
        revision: 1
        datasource: Prometheus
      kyverno:
        gnetId: 15804
