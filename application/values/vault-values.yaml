server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
        unauthenticated_metrics_access = true
      }
  extraVolumes:
    - type: secret
      name: vault-unseal-key
      path: /vault/userconfig/vault-unseal-key
  postStart:
    - /bin/sh
    - -c
    - |
      (
        sleep 15
        for i in $(seq 1 60); do
          SEALED=$(vault status -format=json 2>/dev/null | grep '"sealed"' | grep -o 'true\|false')
          if [ "$SEALED" = "true" ]; then
            UNSEAL_KEY=$(cat /vault/userconfig/vault-unseal-key/unseal-key 2>/dev/null)
            vault operator unseal "$UNSEAL_KEY" 2>/dev/null && echo "Vault unsealed" && exit 0
          elif [ "$SEALED" = "false" ]; then
            echo "Vault already unsealed" && exit 0
          fi
          sleep 5
        done
      ) &
  readinessProbe:
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    failureThreshold: 20
    initialDelaySeconds: 15
    periodSeconds: 5
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: vault.homelab.local
    tls:
      - secretName: vault-tls
        hosts:
          - vault.homelab.local
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer

serverTelemetry:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

ui:
  enabled: true

injector:
  enabled: false
